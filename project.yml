name: LifeRPG

options:
  bundleIdPrefix: com.liferpg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  LifeRPG:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liferpg.app
        PRODUCT_NAME: LifeRPG
        # 显示名带空格，但模块名必须保持无空格，否则 @testable import 会失败
        PRODUCT_MODULE_NAME: LifeRPG
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Life RPG
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  LifeRPGTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EngineTests
      # 把真实的配置表也打进测试包，这样 JSON 写错能在单测阶段就被发现
      - path: Resources
        type: folder
        buildPhase: resources
    dependencies:
      - target: LifeRPG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liferpg.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LifeRPG:
    build:
      targets:
        LifeRPG: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LifeRPGTests
